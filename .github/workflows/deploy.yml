name: Deploy Horizon Truth API (Docker Compose)

on:
  push:
    branches:
      - main
      - dev
      - stage

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
