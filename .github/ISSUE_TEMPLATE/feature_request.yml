name: Feature request
description: Suggest an idea or improvement for the Horizon API (NestJS)
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search [existing issues](https://github.com/Horizon-Truth/horizon-truth-api-v2/issues) first, and check the project charter to see if the idea fits Horizon's mission.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication / authorization
        - Gamification (XP, ranks, learning content)
        - Scenarios / Blogs / Resources
        - Multilingual content (en / am / om)
        - Organizations / Players
        - Database / migrations
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve, and who benefits?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links, references.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this feature
