services:
  backend:
    # IMAGE and IMAGE_TAG are supplied at deploy time via image.env.
    image: ${IMAGE}:${IMAGE_TAG:-latest}

    # Keep deployments isolated by branch/environment.
    # Example: horizon-backend-dev, horizon-backend-stage
    container_name: horizon-backend-${IMAGE_TAG:-latest}

    restart: unless-stopped

    # Load all application environment variables from .env.
    # This includes PORT, DB_*, JWT_*, NODE_ENV, etc.
    env_file:
      - .env

    # Publish the same port that the NestJS application uses.
    # PORT is resolved from the Compose environment (.env / --env-file).
    ports:
      - "${PORT:-3000}:${PORT:-3000}"

    # Allows the container to reach services running on the VPS host,
    # such as PostgreSQL.
    extra_hosts:
      - "host.docker.internal:host-gateway"
